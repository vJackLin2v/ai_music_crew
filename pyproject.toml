[project]
name = "ai_music_crew"
version = "0.1.0"
description = "ai-music-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.1,<2.0.0",
    "midi2audio>=0.1.1",
    "mido>=1.3.3",
    "music21>=9.9.2",
]

[project.scripts]
kickoff = "ai_music_crew.main:kickoff"
run_crew = "ai_music_crew.main:kickoff"
plot = "ai_music_crew.main:plot"
run_with_trigger = "ai_music_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
